name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

env:
  # set for a release (a pushed v* tag, a release made on the website, or a manual run with a tag);
  # the release is built as that version, so the source doesn't need bumping first
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  miyoo:
    name: Miyoo Mini Plus package
    runs-on: ubuntu-latest
    container: aemiii91/miyoomini-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - name: The README shows the source's version
        run: |
          # README's "Latest release" line and the version in the source move together
          v=$(make -s version)
          grep -qF "**Latest release:** [v$v](../../releases/tag/v$v)" README.md ||
            { echo "::error::README.md's Latest release line isn't v$v, the version in the source"; exit 1; }
      - name: Build
        run: |
          # generated files are committed; keep make from regenerating them
          touch src/font_data.h dist/ColumbiaStreet/icon.png
          command -v zip >/dev/null && command -v curl >/dev/null && command -v bzip2 >/dev/null ||
            (apt-get update && apt-get install -y zip curl bzip2)
          if [ -n "$RELEASE_TAG" ]; then
            # the app compares release tags as dotted numbers, so the tag must be v<numbers>
            echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*$' ||
              { echo "::error::release tag $RELEASE_TAG should look like v1.2.3"; exit 1; }
            set -- VERSION="${RELEASE_TAG#v}"
          fi
          make -j"$(nproc)" package CROSS=/opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf- "$@"
          ls -l build/ColumbiaStreet-miyoo.zip
          unzip -l build/ColumbiaStreet-miyoo.zip | grep -q "App/ColumbiaStreet/breaks/AMEN_153bpm.wav"
          # the self-updater needs these: the CA bundle for HTTPS, and VERSION for install.sh
          unzip -l build/ColumbiaStreet-miyoo.zip | grep -q "App/ColumbiaStreet/cacert.pem"
          test "$(unzip -p build/ColumbiaStreet-miyoo.zip App/ColumbiaStreet/VERSION)" = "$(make -s version "$@")"
      - uses: actions/upload-artifact@v4
        with:
          name: ColumbiaStreet-miyoo
          path: build/ColumbiaStreet-miyoo.zip

  test:
    name: Engine and UI tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the test harness
        run: |
          touch src/font_data.h dist/ColumbiaStreet/icon.png
          sh tools/fetch_samples.sh dist/ColumbiaStreet
          make build/cs_test
          mkdir -p build/test
          build/cs_test build/test dist/ColumbiaStreet | tee build/test/results.txt
      - name: Check the results
        run: |
          r=build/test/results.txt
          grep -q "^samples: 7 banks, 20 bass" $r
          grep -q "0 full-scale samples (want 0)" $r
          grep -q "^grid straight: .*(want all and over 0.99: 1)" $r
          grep -q "^fit: .*(want about half: 1)" $r
          grep -q "^bits  1: 3 output levels" $r
          awk '/^bits  4:/ { exit !($3 + 0 <= 16) }' $r
          grep -q "^comp: .*(want over 6: 1)" $r
          grep -q "^generator: 199 seeds, 0 identical pairs, 0 out of range" $r
          grep -q "^save/load: 1, same 1, bpm 163.5, bits 7, slot D used 1" $r
          grep -q "^bass voices: 24, 0 silent (want 0)" $r
          grep -q "^select: new beat 1, mutes kept 1, mixer kept 1; undo back 1, mutes kept 1" $r
          grep -q "^sync: bpm=140.0 following=1" $r
          grep -q "^sync timing: .*(want under 1 and 2: 1)" $r
          grep -q "^sync timing, a leader without echo: .*(want under 6: 1)" $r
          grep -q "^save compat v0.1: 1, bpm 151, output 0, ppqn 2, pulse 5" $r
          grep -q "^clock out: 2 PPQN at 120 BPM on the right -> 16 pulses in 4 s, mean gap 250.00 ms, width 5.00 ms, other values 0" $r
          grep -q "^clock out: 24 PPQN at 120 BPM on the right -> 192 pulses in 4 s, mean gap 20.83 ms, width 5.00 ms, other values 0" $r
          grep -q "^clock out: 2 PPQN at 120 BPM on the left -> 16 pulses .* other values 0" $r
          grep -q "^clock out stopped: pulses 0 (want 0)" $r
          grep -q "^update prompt: shown 1, A installs 1, B closes it 1, pattern untouched 1" $r
      - name: Self-update against a local fake GitHub
        run: make update-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/test/

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [miyoo, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ColumbiaStreet-miyoo
      - name: Check the package was built as this version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # the app compares the release tag with the version it was built as; a mismatch would offer the update forever
          v=$(unzip -p ColumbiaStreet-miyoo.zip App/ColumbiaStreet/VERSION)
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG doesn't match the package's version $v"; exit 1; }
      - name: Create the GitHub release with the Miyoo package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ColumbiaStreet-miyoo.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ColumbiaStreet-miyoo.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Columbia Street $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi
